# Production stack on a single VPS:  Caddy (80/443) -> app -> db
#
#   cp .env.example /etc/vietdragon/.env   # fill it in; keep it chmod 600, outside the repository
#   docker compose --env-file /etc/vietdragon/.env up -d --build
#
# One app instance only: Next's data/route cache is per-process (see docs/deployment.md).
# For local development use compose.dev.yaml (Postgres only) and `pnpm dev`.
name: viet-dragon

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (e.g. vietdragon.vn)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  app:
    build:
      context: .
      target: runner
      args:
        SITE_URL: ${SITE_URL:?set SITE_URL (e.g. https://vietdragon.vn)}
    image: viet-dragon-app:${APP_TAG:-local}
    restart: unless-stopped
    init: true
    # No published ports: reachable only through Caddy, so a client cannot spoof X-Real-IP.
    environment:
      # The DML-only role (deploy/db-init/01-app-role.sh) — never the owner.
      DATABASE_URL: postgres://vietdragon_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/vietdragon
      SITE_URL: ${SITE_URL:?set SITE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -hex 32)}
      LOG_LEVEL: ${LOG_LEVEL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONSULT_RECEIVER_EMAIL: ${CONSULT_RECEIVER_EMAIL:-}
      # Images added through the admin live on this volume, never in public/. Back it up together with the database (docs/deployment.md).
      UPLOADS_DIR: /data/uploads
      MEDIA_MAX_IMAGE_MB: ${MEDIA_MAX_IMAGE_MB:-}
      MEDIA_MAX_TOTAL_MB: ${MEDIA_MAX_TOTAL_MB:-}
    volumes:
      - nextcache:/app/.next/cache
      - uploads:/data/uploads
    networks: [edge, internal]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vietdragon
      POSTGRES_DB: vietdragon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietdragon -d vietdragon"]
      interval: 5s
      timeout: 3s
      retries: 10
    # The entrypoint starts as root, fixes ownership of the data dir, then drops to `postgres`.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  # One-shot: applies pending migrations as the schema OWNER, then exits. The app waits for it.
  # (Seed-if-empty joins this service in Phase 3.)
  migrate:
    build:
      context: .
      target: tools
    image: viet-dragon-tools:${APP_TAG:-local}
    restart: "no"
    environment:
      DATABASE_URL: postgres://vietdragon:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/vietdragon
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  # Nightly backup of the database and the uploads volume, VERIFIED by restoring it into a scratch database (docs/deployment.md «Backups»).
  # It connects as the schema OWNER because the verification needs CREATE DATABASE; it has no published port and no access to the app.
  backup:
    build:
      context: ./deploy/backup
    image: viet-dragon-backup:${APP_TAG:-local}
    restart: unless-stopped
    init: true
    environment:
      PGHOST: db
      PGUSER: vietdragon
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: vietdragon
      BACKUP_HOUR: ${BACKUP_HOUR:-}
      BACKUP_TZ: ${BACKUP_TZ:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
    # Credentials of the off-box remote, as RCLONE_CONFIG_<REMOTE>_<OPTION>=… lines (docs/deployment.md). Optional: no file, no off-box copy.
    env_file:
      - path: ${BACKUP_OFFSITE_ENV_FILE:-./backup-offsite.env}
        required: false
    volumes:
      - backups:/backups
      # Read-only: the backup never changes what the app serves.
      - uploads:/data/uploads:ro
    # The base image declares a data volume that nothing here uses; a tmpfs on it stops compose from creating an anonymous one.
    tmpfs: [/tmp, /var/lib/postgresql/data]
    networks: [internal, edge]
    depends_on:
      db:
        condition: service_healthy
      # A database with no tables yet is not worth a backup (and verify.sh refuses to call one verified): wait for the schema.
      migrate:
        condition: service_completed_successfully
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  # Break-glass account management — not started by `up` (profile). Create the first admin, or recover:
  #   docker compose --env-file /etc/vietdragon/.env run --rm admin-cli create
  #   docker compose --env-file /etc/vietdragon/.env run --rm admin-cli reset-password someone@example.com
  # Interactive (hidden password prompt), so `run` must keep its terminal: never pass -T. Connects as the
  # DML-only app role, exactly like the app — it creates rows and never needs DDL.
  admin-cli:
    profiles: [tools]
    build:
      context: .
      target: tools
    image: viet-dragon-tools:${APP_TAG:-local}
    entrypoint: ["node_modules/.bin/tsx", "scripts/admin-cli.ts"]
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      DATABASE_URL: postgres://vietdragon_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/vietdragon
      SITE_URL: ${SITE_URL:?set SITE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  # Restores the database (and the uploads) from a backup, or loads a first dump — with the app STOPPED (docs/deployment.md «Restore»):
  #   docker compose --env-file /etc/vietdragon/.env stop app
  #   docker compose --env-file /etc/vietdragon/.env --profile tools run --rm restore latest
  #   docker compose --env-file /etc/vietdragon/.env --profile tools run --rm -v "$PWD/seed.dump:/import/seed.dump:ro" restore --dump /import/seed.dump
  # Runs as root with only the three capabilities needed to put the uploaded files back under their original owner (`node`); the root FS is read-only.
  restore:
    profiles: [tools]
    build:
      context: ./deploy/backup
    image: viet-dragon-backup:${APP_TAG:-local}
    entrypoint: ["/opt/backup/restore.sh"]
    restart: "no"
    user: "0:0"
    healthcheck:
      disable: true
    environment:
      PGHOST: db
      PGUSER: vietdragon
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: vietdragon
    volumes:
      - backups:/backups
      - uploads:/data/uploads
    tmpfs: [/tmp, /var/lib/postgresql/data]
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

networks:
  edge: {}
  # No route to the internet or the host: the database is reachable only from app and migrate.
  internal:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  nextcache:
  uploads:
  # Backup sets (<stamp>/db.dump + uploads.tar.gz …). On the same disk as the data: copy them off the box too (BACKUP_RCLONE_REMOTE).
  backups:
