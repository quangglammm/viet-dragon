# Production stack on a single VPS:  Caddy (80/443) -> app -> db
#
#   cp .env.example /etc/vietdragon/.env   # fill it in; keep it chmod 600, outside the repository
#   docker compose --env-file /etc/vietdragon/.env up -d --build
#
# One app instance only: Next's data/route cache is per-process (see docs/deployment.md).
# For local development use compose.dev.yaml (Postgres only) and `pnpm dev`.
name: viet-dragon

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (e.g. vietdragon.vn)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  app:
    build:
      context: .
      target: runner
      args:
        SITE_URL: ${SITE_URL:?set SITE_URL (e.g. https://vietdragon.vn)}
    image: viet-dragon-app:${APP_TAG:-local}
    restart: unless-stopped
    init: true
    # No published ports: reachable only through Caddy, so a client cannot spoof X-Real-IP.
    environment:
      # The DML-only role (deploy/db-init/01-app-role.sh) — never the owner.
      DATABASE_URL: postgres://vietdragon_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/vietdragon
      SITE_URL: ${SITE_URL:?set SITE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET (openssl rand -hex 32)}
      LOG_LEVEL: ${LOG_LEVEL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONSULT_RECEIVER_EMAIL: ${CONSULT_RECEIVER_EMAIL:-}
      # Images added through the admin live on this volume, never in public/. Back it up together with the database (docs/deployment.md).
      UPLOADS_DIR: /data/uploads
      MEDIA_MAX_IMAGE_MB: ${MEDIA_MAX_IMAGE_MB:-}
    volumes:
      - nextcache:/app/.next/cache
      - uploads:/data/uploads
    networks: [edge, internal]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vietdragon
      POSTGRES_DB: vietdragon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vietdragon -d vietdragon"]
      interval: 5s
      timeout: 3s
      retries: 10
    # The entrypoint starts as root, fixes ownership of the data dir, then drops to `postgres`.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  # One-shot: applies pending migrations as the schema OWNER, then exits. The app waits for it.
  # (Seed-if-empty joins this service in Phase 3.)
  migrate:
    build:
      context: .
      target: tools
    image: viet-dragon-tools:${APP_TAG:-local}
    restart: "no"
    environment:
      DATABASE_URL: postgres://vietdragon:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/vietdragon
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  # Break-glass account management — not started by `up` (profile). Create the first admin, or recover:
  #   docker compose --env-file /etc/vietdragon/.env run --rm admin-cli create
  #   docker compose --env-file /etc/vietdragon/.env run --rm admin-cli reset-password someone@example.com
  # Interactive (hidden password prompt), so `run` must keep its terminal: never pass -T. Connects as the
  # DML-only app role, exactly like the app — it creates rows and never needs DDL.
  admin-cli:
    profiles: [tools]
    build:
      context: .
      target: tools
    image: viet-dragon-tools:${APP_TAG:-local}
    entrypoint: ["node_modules/.bin/tsx", "scripts/admin-cli.ts"]
    restart: "no"
    stdin_open: true
    tty: true
    environment:
      DATABASE_URL: postgres://vietdragon_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/vietdragon
      SITE_URL: ${SITE_URL:?set SITE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
    networks: [internal]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

networks:
  edge: {}
  # No route to the internet or the host: the database is reachable only from app and migrate.
  internal:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  nextcache:
  uploads:
