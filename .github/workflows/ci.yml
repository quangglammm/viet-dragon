name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * 1" # Mondays 02:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6 # the version comes from `packageManager` in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm exec tsc --noEmit
      - name: Lint (no warnings allowed)
        run: pnpm lint --max-warnings 0
      - name: Unit tests
        run: pnpm test
      - name: Production build
        env:
          # Baked into the build (canonical URLs, robots.txt, sitemap); any well-formed origin will do here.
          SITE_URL: https://vietdragon.vn
        run: pnpm build

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Production dependencies have no high or critical advisory
        run: pnpm audit --prod --audit-level=high
